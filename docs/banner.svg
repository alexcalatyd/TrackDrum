<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <radialGradient id="glowSilver" cx="28%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#c7ccd6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c7ccd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="80%" cy="76%" r="60%">
      <stop offset="0%" stop-color="#ff6b2c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff6b2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd3da"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c3c40"/>
      <stop offset="100%" stop-color="#17171a"/>
    </linearGradient>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="#0e0e10"/>
  <rect width="1200" height="320" fill="url(#glowSilver)"/>
  <rect width="1200" height="320" fill="url(#glowOrange)"/>

  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="107" x2="1200" y2="107"/>
    <line x1="0" y1="214" x2="1200" y2="214"/>
  </g>

  <!-- The app icon (Scripts/make-icon.swift) on the left and the name on the right. -->
  <g filter="url(#iconShadow)">
    <svg x="214" y="84" width="152" height="152" viewBox="0 0 824 824">
      <rect width="824" height="824" rx="186" fill="url(#plate)"/>
      <rect x="2.5" y="2.5" width="819" height="819" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="5"/>
      <rect x="92" y="212" width="640" height="400" rx="44" fill="#2a2a28"/>
      <g fill="#3a3a37">
        <rect x="122" y="242" width="131.5" height="161" rx="16"/>
        <rect x="271.5" y="242" width="131.5" height="161" rx="16"/>
        <rect x="421" y="242" width="131.5" height="161" rx="16"/>
        <rect x="570.5" y="242" width="131.5" height="161" rx="16"/>
        <rect x="122" y="421" width="131.5" height="161" rx="16"/>
        <rect x="421" y="421" width="131.5" height="161" rx="16"/>
        <rect x="570.5" y="421" width="131.5" height="161" rx="16"/>
      </g>
      <rect x="271.5" y="421" width="131.5" height="161" rx="16" fill="#ff6b2c"/>
    </svg>
  </g>

  <text x="406" y="160" dominant-baseline="central"
        font-family="ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="124" font-weight="700" letter-spacing="-1.5"
        fill="url(#textFade)">TrackDrum</text>
</svg>
